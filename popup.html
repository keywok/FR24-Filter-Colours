<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { width: 320px; max-height: 560px; overflow-y: auto; padding: 12px; margin: 0; font: 13px/1.5 system-ui, sans-serif; }

  h3 { margin: 12px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; opacity: .45; }
  h3:first-child { margin-top: 0; }

  /* Groups */
  .group { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  .group input[type=color] { width: 32px; height: 26px; border: 1px solid #ccc; border-radius: 4px; padding: 1px; cursor: pointer; flex-shrink: 0; }
  .group input[type=text]  { flex: 1; padding: 3px 7px; border: 1px solid #ccc; border-radius: 4px; font: inherit; min-width: 0; }
  .group .del { background: none; border: none; cursor: pointer; color: #bbb; font-size: 18px; line-height: 1; padding: 0 2px; flex-shrink: 0; }
  .group .del:hover { color: #d00; }

  .swatches { display: flex; gap: 3px; margin: 0 0 6px 38px; }
  .swatch { width: 22px; height: 16px; border-radius: 3px; cursor: pointer; border: 2px solid transparent; padding: 0; }
  .swatch:hover { border-color: #333; }

  #addGroup { width: 100%; padding: 5px 8px; margin-top: 6px; border: 1px dashed #ccc; background: none; cursor: pointer; border-radius: 4px; color: #666; font: inherit; }
  #addGroup:hover { border-color: #999; color: #333; }

  /* Filter assignments */
  .filter-row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  .filter-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  .filter-row select { font: 12px system-ui; padding: 2px 4px; border: 1px solid #ccc; border-radius: 4px; max-width: 130px; }

  #noFilters { font-size: 12px; color: #999; font-style: italic; }

  /* Airport settings */
  .airport-setting { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 12px; }
  .airport-setting input[type=color] { width: 32px; height: 26px; border: 1px solid #ccc; border-radius: 4px; padding: 1px; cursor: pointer; flex-shrink: 0; }
  .airport-setting label { cursor: pointer; }
</style>
</head>
<body>
<div style="display:flex;gap:6px;margin-bottom:10px;">
  <button id="refreshFilters" style="flex:1;padding:5px 8px;border:1px solid #ccc;border-radius:4px;background:none;cursor:pointer;font:inherit;color:#666;">↺ Refresh</button>
  <button id="toggleEnabled" style="flex:1;padding:5px 8px;border-radius:4px;cursor:pointer;font:inherit;font-weight:600;border:1px solid;"></button>
</div>

<h3>Colour Groups</h3>
<div id="groups"></div>
<button id="addGroup">+ Add group</button>

<h3>Airport Dots</h3>
<div class="airport-setting">
  <input type="checkbox" id="showAllAirports">
  <label for="showAllAirports">Show all airport dots</label>
</div>
<div class="airport-setting">
  <input type="color" id="defaultAirportColor" value="#ff3b3b">
  <label for="defaultAirportColor">Default colour (when no group matches)</label>
</div>

<h3>Filter Assignments</h3>
<div id="filters"><p id="noFilters">Open flightradar24.com first to load filters.</p></div>

<p id="version" style="margin:12px 0 0;font-size:10px;color:#bbb;text-align:right;"></p>
<script src="popup.js"></script>
</body>
</html>
